# ============================================
# DOAPP - CI/CD Pipeline for Hostinger VPS
# ============================================

name: CI/CD Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  NODE_VERSION: '20'

jobs:
  # ============================================
  # Lint & Type Check (solo server — mobile y client tienen errores conocidos)
  # ============================================
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run ESLint (server)
        run: npx eslint server/routes server/middleware server/services --ext .ts --max-warnings 50 || true

      # GATE: server type errors now BLOCK the deploy (was informational).
      - name: TypeScript check (server) — blocks deploy on errors
        run: npx tsc --noEmit --project tsconfig.server.json

      # GATE: React hook-order violations block the deploy. This exact class
      # (hooks at module scope / conditional hooks) white-screened prod before.
      - name: Guard against React hook-order bugs
        run: |
          npx eslint client -f json > /tmp/eslint-report.json 2>/dev/null || true
          count=$(node -e "try{const r=require('/tmp/eslint-report.json');let n=0;for(const f of r)for(const m of f.messages)if(m.ruleId==='react-hooks/rules-of-hooks'&&m.severity===2)n++;console.log(n)}catch(e){console.log(0)}")
          echo "react-hooks/rules-of-hooks violations: $count"
          if [ "$count" -gt 0 ]; then
            echo "❌ Hook-order violation — this class white-screened prod before. Fix before deploy."
            npx eslint client 2>&1 | grep -B1 -A3 "rules-of-hooks" || true
            exit 1
          fi
          echo "✅ No hook-order violations"

      - name: Check for critical security issues
        run: |
          echo "🔍 Checking for hardcoded secrets..."
          # Require 20+ chars after sk- to avoid false positives (e.g. "task-claim" contains "sk-c")
          if grep -rn --include="*.ts" -E "sk-[a-zA-Z0-9]{20,}" server/ | grep -v "process\.env" | grep -v "\.env"; then
            echo "⚠️  Possible API key found in server code"
            exit 1
          fi
          echo "✅ No hardcoded secrets found"

  # ============================================
  # Migrations run cleanly from scratch (catches column drift before prod)
  # ============================================
  migrations:
    name: Migrations (from scratch)
    runs-on: ubuntu-latest
    needs: lint

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: doapp_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      # REPORT (not yet a hard gate): apply every migration on an empty DB.
      # Today this FAILS because the schema isn't fully captured in migrations —
      # base tables (e.g. `payments`) were created by the old sequelize.sync()
      # /ensureSchema, not by a migration, so a from-scratch run can't build them.
      # It stays informational (continue-on-error) so it can't block deploys.
      # To turn it into a real gate: add a single baseline migration that creates
      # the current full schema (pg_dump --schema-only of prod), then this passes.
      - name: Apply all migrations from scratch (report)
        continue-on-error: true
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/doapp_ci
        run: |
          echo "🗄️  Applying $(ls migrations/*.cjs | wc -l) migrations on a fresh DB..."
          NODE_ENV=test npx sequelize-cli db:migrate
          echo "✅ All migrations applied cleanly (schema is fully migration-based)"

      - name: Check the newest migration is reversible
        continue-on-error: true
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/doapp_ci
        run: |
          echo "↩️  Testing rollback of the latest migration..."
          NODE_ENV=test npx sequelize-cli db:migrate:undo
          NODE_ENV=test npx sequelize-cli db:migrate
          echo "✅ Rollback + re-apply OK"

  # ============================================
  # Build
  # ============================================
  build:
    name: Build Application
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build frontend
        run: npm run build:client
        env:
          VITE_API_URL: https://doapparg.site/api
          VITE_GOOGLE_ANALYTICS_ID: ${{ secrets.VITE_GOOGLE_ANALYTICS_ID || '' }}
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY || '' }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN || '' }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID || '' }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET || '' }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID || '' }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID || '' }}
          VITE_FIREBASE_MEASUREMENT_ID: ${{ secrets.VITE_FIREBASE_MEASUREMENT_ID || '' }}

      - name: Verify build output
        run: |
          if [ ! -d "dist/public" ] && [ ! -d "dist" ]; then
            echo "❌ Build output not found"
            exit 1
          fi
          echo "✅ Build output verified"

  # ============================================
  # Deploy to Hostinger VPS
  # ============================================
  deploy:
    name: Deploy to Hostinger VPS
    runs-on: ubuntu-latest
    needs: [build, migrations]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            set -e
            cd /var/www/doapp

            echo "📋 Current commit before deploy:"
            git rev-parse --short HEAD

            echo "📥 Pulling latest code..."
            git fetch origin && git reset --hard origin/master

            echo "📦 Installing dependencies..."
            npm install --legacy-peer-deps

            echo "🔨 Building frontend..."
            npm run build:client

            echo "🗄️  Running database migrations..."
            NODE_ENV=production npx sequelize-cli db:migrate
            echo "✅ Migrations completed"

            echo "🔄 Restarting application..."
            pm2 stop doapp 2>/dev/null || true
            pm2 delete doapp 2>/dev/null || true
            pm2 start ecosystem.config.cjs

            echo "⏳ Waiting for server to start (max 3 min)..."
            started=false
            for i in $(seq 1 18); do
              sleep 10
              if curl -sf http://localhost:3001/api/health > /dev/null 2>&1; then
                echo "✅ Server responding after ~${i}0s"
                started=true
                break
              fi
              echo "  Not ready yet ($i/18)..."
            done
            if [ "$started" = "false" ]; then
              echo "❌ Server did not start within 3 minutes"
              pm2 logs doapp --lines 50 --nostream || true
              exit 1
            fi

            echo "⏳ Confirming stability for 60s..."
            for j in 1 2 3 4 5 6; do
              sleep 10
              if ! curl -sf http://localhost:3001/api/health > /dev/null 2>&1; then
                echo "❌ Server crashed during stability check (attempt $j)"
                pm2 status
                pm2 logs doapp --lines 30 --nostream || true
                exit 1
              fi
              echo "  Stable ($j/6)"
            done
            echo "✅ Server is stable"

            echo "🌐 Frontend smoke test (nginx serves the built app)..."
            if curl -sf http://localhost/ 2>/dev/null | grep -q 'id="root"'; then
              echo "✅ Frontend HTML served OK (app root found)"
            else
              echo "⚠️  Frontend smoke test did not find the app root — check nginx root / build output"
            fi

            echo "📋 PM2 status:"
            pm2 status

            echo "📋 PM2 error log (last 30 lines):"
            tail -30 /var/log/pm2/doapp-error.log 2>/dev/null || pm2 logs doapp --lines 30 --nostream --err || true

            echo "✅ Deploy completed! Commit:"
            git rev-parse --short HEAD

            echo "📋 PM2 status:"
            pm2 status

            echo "✅ Deploy completed! New commit:"
            git rev-parse --short HEAD

      - name: Health Check (Cloudflare routing - informational)
        continue-on-error: true
        run: |
          echo "ℹ️  Server confirmed running locally. Checking Cloudflare routing..."
          echo "⚠️  Cloudflare Tunnel takes ~10-20min to re-establish after restart."
          sleep 30
          for i in $(seq 1 6); do
            http_code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 https://doapparg.site/api/health 2>/dev/null || echo "ERR")
            body=$(curl -s --max-time 15 https://doapparg.site/api/health 2>/dev/null || echo "no response")
            echo "Attempt $i/6: HTTP $http_code | $body"
            if [ "$http_code" = "200" ]; then
              echo "✅ External health check passed on attempt $i"
              exit 0
            fi
            sleep 30
          done
          echo "⚠️  External health check timed out (Cloudflare routing delay) - app IS running locally"
