# ============================================
# DOAPP - Staging deploy (manual)
# ============================================
# Deploys the current branch to a STAGING copy that mirrors production, so
# changes can be verified on a real server before touching the live site.
#
# ⚠️ ONE-TIME SETUP REQUIRED (see .github/STAGING.md) before this can run:
#   - a staging dir on the VPS: /var/www/doapp-staging (git clone of the repo)
#   - a staging database (e.g. doapp_staging) + STAGING_DATABASE_URL in its .env
#   - a PM2 app "doapp-staging" on port 3002 (ecosystem.staging.config.cjs)
#   - an nginx vhost for staging.doapparg.com -> /var/www/doapp-staging/dist/spa
#
# Until then this workflow simply won't be triggered (it's manual-only).
# ============================================

name: Deploy to Staging

on:
  workflow_dispatch: {}            # manual "Run workflow" button only
  push:
    branches: [staging]            # or auto-deploy a dedicated 'staging' branch

# Permisos mínimos del GITHUB_TOKEN: ningún job de este workflow necesita escribir en el repositorio.
# Sin este bloque el token tiene los permisos por defecto del repositorio (a menudo de escritura).
permissions:
  contents: read

env:
  NODE_VERSION: '20'

jobs:
  # Reuse the same gates as production before touching staging.
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci --legacy-peer-deps
      - name: TypeScript check (server)
        run: npx tsc --noEmit --project tsconfig.server.json

  deploy-staging:
    name: Deploy to Staging VPS
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Deploy via SSH
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
        uses: appleboy/ssh-action@55dabf81b49d4120609345970c91507e2d734799 # v1.0.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          # GITHUB_REF_NAME es una variable del runner de GitHub: NO existe en la sesión SSH del servidor salvo
          # que se la pase. Sin esto `origin/${GITHUB_REF_NAME:-master}` caía siempre en master y staging
          # desplegaba master aunque se hubiera disparado desde otra rama.
          envs: GITHUB_REF_NAME
          command_timeout: 25m
          script: |
            set -e
            cd /var/www/doapp-staging

            echo "📥 Pulling latest code onto staging..."
            git fetch origin
            git reset --hard "origin/${GITHUB_REF_NAME:-master}"

            echo "📦 Installing dependencies..."
            npm install --legacy-peer-deps

            echo "🔨 Building frontend..."
            npm run build:client

            echo "🗄️  Running migrations on the STAGING database..."
            NODE_ENV=production npx sequelize-cli db:migrate
            echo "✅ Migrations completed"

            echo "🔄 Restarting staging app (port 3002)..."
            pm2 startOrReload ecosystem.staging.config.cjs

            echo "⏳ Waiting for staging server..."
            started=false
            for i in $(seq 1 18); do
              sleep 10
              if curl -sf http://localhost:3002/api/health > /dev/null 2>&1; then
                echo "✅ Staging server responding after ~${i}0s"
                started=true
                break
              fi
              echo "  Not ready yet ($i/18)..."
            done
            if [ "$started" = "false" ]; then
              echo "❌ Staging server did not start"
              pm2 logs doapp-staging --lines 50 --nostream || true
              exit 1
            fi

            echo "🌐 Frontend smoke test..."
            if curl -sf http://localhost/ -H 'Host: staging.doapparg.com' 2>/dev/null | grep -q 'id="root"'; then
              echo "✅ Staging frontend served OK"
            else
              echo "⚠️  Staging frontend check inconclusive — verify the nginx vhost"
            fi

            echo "✅ Staging deploy completed! Commit:"
            git rev-parse --short HEAD
