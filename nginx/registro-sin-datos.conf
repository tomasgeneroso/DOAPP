# Registro de acceso de nginx SIN datos personales en la dirección.
#
# Por qué: el formato por defecto (`combined`) escribe `$request` y `$http_referer` ENTEROS, con lo que va después del `?`. Los enlaces de los correos
# («verificá tu correo», «cambiá tu clave») llevan un secreto ahí (`/reset-password?token=…`): cada vez que alguien los abre, ese secreto queda
# escrito en el registro, y también en el `Referer` de cada pedido que la misma pantalla hace después (la API, las imágenes).
# Este formato guarda la ruta SIN la consulta (`/reset-password`) y el `Referer` también sin consulta.
# NO quita la IP (`$remote_addr`): hace falta para seguridad y anti-abuso; se conserva solo el tiempo que fije el rotado de registros.
#
# Cómo se instala (en el VPS, una sola vez; este archivo va dentro del bloque `http { }`, por eso se pone en conf.d):
#   1. sudo cp nginx/registro-sin-datos.conf /etc/nginx/conf.d/registro-sin-datos.conf
#   2. En el archivo del sitio (sites-enabled/doapparg), en cada `server { }`, reemplazar la línea `access_log …;` por:
#        access_log /var/log/nginx/doapparg.access.log sin_datos;
#   3. sudo nginx -t && sudo systemctl reload nginx
#   4. Comprobar: abrir un enlace con `?token=prueba` y ver que `tail /var/log/nginx/doapparg.access.log` muestra la ruta SIN `?token=prueba`.
# Los registros viejos ya escritos conservan lo anterior: se vencen con el rotado (logrotate) o se borran a mano.
# Lo vigila tests/datosPersonalesAfuera.test.ts.

# La ruta pedida, sin lo que va después del `?`.
map $request_uri $ruta_sin_consulta {
    default                 $request_uri;
    "~^(?<ruta_limpia>[^?]*)"  $ruta_limpia;
}

# El `Referer`, también sin consulta (si no, el secreto de la pantalla anterior vuelve a aparecer acá).
map $http_referer $referer_sin_consulta {
    default                 "-";
    "~^(?<referer_limpio>[^?#]*)"  $referer_limpio;
}

log_format sin_datos '$remote_addr - $remote_user [$time_local] '
                     '"$request_method $ruta_sin_consulta $server_protocol" '
                     '$status $body_bytes_sent "$referer_sin_consulta" "$http_user_agent" $request_time';
