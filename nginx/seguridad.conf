# GENERADO por server/scripts/generarSeguridadNginx.ts desde shared/seguridad/csp.ts. NO editar a mano: tests/seguridadDelSitio.test.ts compara.
# Se incluye con `include /etc/nginx/seguridad.conf;` en el server y en cada location que ponga add_header propio
# (nginx no hereda add_header hacia un location que define el suyo).
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(self), camera=(self), microphone=()" always;
add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'sha256-W8EhV52tWZWYLqJgs4zceWWFIYVAPB5IAU3EnqeFOVk=' 'sha256-yI8gkplbApd2vu0xESNT0PqXXxysAVgi8+4hXl5/1Jo=' 'sha256-HaDhDH6eU0bJDhy9deZspFD/yu7eIZyOyAP1y+Cqn8o=' 'sha256-Zdtp5AcsMcMM/+5/+SqOlWKrHj8gDR3q9cAisPtzpDo=' https://www.googletagmanager.com https://connect.facebook.net https://unpkg.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://unpkg.com; img-src 'self' data: blob: https:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' wss://doapparg.com https://www.google-analytics.com https://*.google-analytics.com https://*.analytics.google.com https://www.googletagmanager.com https://www.facebook.com https://graph.facebook.com https://connect.facebook.net https://api.mapbox.com https://nominatim.openstreetmap.org https://apis.datos.gob.ar https://firebaseinstallations.googleapis.com https://fcmregistrations.googleapis.com https://fcm.googleapis.com; frame-src 'self' https://www.facebook.com; media-src 'self' blob: https:; worker-src 'self' blob:; manifest-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;
